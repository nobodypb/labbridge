name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: pip install --require-hashes -r tools/requirements.lock
      - run: pip install --no-build-isolation --no-deps -e host/generated -e host
      - run: tools/generate.sh
      - run: git diff --exit-code -- api/openapi.json firmware/generated host/generated web/generated
      - run: tools/check.sh
      - run: black --check host/src host/tests tests tools
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - run: python3 tools/public_tree.py
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        board: [sticks3, usb-otg, esp32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: . "$IDF_PATH/export.sh" && tools/build_firmware.sh "${{ matrix.board }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            .build/${{ matrix.board }}/*.bin
            .build/${{ matrix.board }}/bootloader/bootloader.bin
            .build/${{ matrix.board }}/partition_table/partition-table.bin
            .build/${{ matrix.board }}/flash_args
